services:
  metlake:
    build: .
    image: metlake:latest
    container_name: metlake
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARCHIVE_ROOT: /archive
    volumes:
      - ${METLAKE_ARCHIVE_HOST_PATH:-./archive}:/archive

  frontend:
    build: ./frontend
    image: metlake-frontend:latest
    container_name: metlake-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${METLAKE_ARCHIVE_HOST_PATH:-./archive}:/data:ro
